global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'airflow'
    metrics_path: /airflow_metrics
    static_configs:
      - targets: ['airflow-exporter:9112']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']