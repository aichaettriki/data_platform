server:
  applicationConnectors:
    - type: http
      port: 5000
  adminConnectors:
    - type: http
      port: 5001
 
db:
  driverClass: org.postgresql.Driver
  # La syntaxe ${VAR} permet à Dropwizard de lire vos variables Docker
  url: ${MARQUEZ_DB_URL}
  user: ${MARQUEZ_DB_USER}
  password: ${MARQUEZ_DB_PASSWORD}

# logging

logging:
  level: INFO
  appenders:
    - type: console