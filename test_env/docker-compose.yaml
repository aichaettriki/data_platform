version: "3.8"

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_metabase
    ports:
      - 3020:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: db
    depends_on:
      - db

  db:
    image: postgres:13
    container_name: metabase_pg_metabase
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./backup:/backup
