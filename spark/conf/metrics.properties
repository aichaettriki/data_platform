# Enable Prometheus sink
*.sink.prometheus.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheus.path=/metrics/prometheus

# Master metrics
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
master.source.application.class=org.apache.spark.metrics.source.ApplicationSource

# Worker metrics
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.application.class=org.apache.spark.metrics.source.ApplicationSource

# Application metrics
applications.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Enable JVM metrics
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource