# Enable Prometheus Servlet Sink
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# Enable all metrics sources
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Master specific metrics
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Worker specific metrics  
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Executor metrics (for applications)
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Driver metrics (for applications)
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Enable codahale metrics
*.sink.servlet.class=org.apache.spark.metrics.sink.MetricsServlet
*.sink.servlet.path=/metrics/json

# ---------- OpenLineage ----------
spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener

spark.openlineage.transport.type=http
spark.openlineage.transport.url=http://marquez:5000/api/v1/lineage
spark.openlineage.namespace=spark


