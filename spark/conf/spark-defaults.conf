# ==============================================================================
# spark-defaults.conf — Production Configuration
# Spark + MinIO (S3A) + OpenLineage
# ==============================================================================
# PRINCIPE : ce fichier contient TOUTE la config infra partagée.
# Les secrets (access.key / secret.key) sont injectés via variables d'env.
# Les configs job-specific (appName, mémoire) restent dans le code.
# ==============================================================================


# ===============================
# S3A / MinIO — Connexion
# ===============================
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minio
spark.hadoop.fs.s3a.secret.key minio123
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem



# ===============================
# S3A — Performances réseau
# ===============================
# Threads parallèles pour upload multipart
spark.hadoop.fs.s3a.threads.max = 20
spark.hadoop.fs.s3a.connection.maximum = 20

# Taille des blocs multipart (recommandé 64-128 MB en prod)
spark.hadoop.fs.s3a.multipart.size = 134217728

# Retry en cas d'erreur réseau transitoire
spark.hadoop.fs.s3a.attempts.maximum = 10
spark.hadoop.fs.s3a.retry.limit = 7
spark.hadoop.fs.s3a.retry.interval = 500ms

# Fast upload : envoie les blocs au fur et à mesure (évite de tout buffériser en RAM)
spark.hadoop.fs.s3a.fast.upload = true
spark.hadoop.fs.s3a.fast.upload.buffer = disk
spark.hadoop.fs.s3a.fast.upload.active.blocks = 4


# ===============================
# S3A Committer — Magic (recommandé MinIO)
# ===============================
# "magic"     : écrit directement sur S3, 0 disque local, plus rapide
# "directory" : staging local avant upload, plus lent mais plus compatible
# Avec MinIO récent → magic est stable et recommandé
spark.hadoop.fs.s3a.committer.name = magic
spark.hadoop.fs.s3a.committer.magic.enabled = true

# Désactiver l'ancien committer FileOutputCommitter (incompatible S3)
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version = 2
spark.speculation = false

# Gestion des conflits sur les partitions existantes
spark.hadoop.fs.s3a.committer.staging.conflict-mode = replace


# ===============================
# OpenLineage — Data Lineage
# ===============================
spark.extraListeners = io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type = http
spark.openlineage.transport.url = http://marquez:5000/api/v1/lineage
spark.openlineage.namespace = spark-prod-ins


# ===============================
# Sérialisation
# ===============================
spark.serializer = org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max = 512m


# ===============================
# SQL / AQE (Adaptive Query Execution)
# ===============================
# Active l'optimiseur adaptatif (Spark 3+, toujours activer en prod)
spark.sql.adaptive.enabled = true
spark.sql.adaptive.coalescePartitions.enabled = true
spark.sql.adaptive.skewJoin.enabled = true

# Taille cible des partitions après coalesce adaptatif (256 MB est un bon équilibre)
spark.sql.adaptive.advisoryPartitionSizeInBytes= 268435456

# Broadcast join threshold (100 MB)
spark.sql.autoBroadcastJoinThreshold = 104857600

# Écriture partitionnée : ne réécrire que les partitions touchées
spark.sql.sources.partitionOverwriteMode = dynamic

# Limite par fichier pour éviter les fichiers trop gros (5M lignes)
spark.sql.files.maxRecordsPerFile = 5000000

# Parquet natif Spark (désactiver la conversion Hive pour éviter les bugs de schéma)
spark.sql.hive.convertMetastoreParquet = false


# ===============================
# Shuffle
# ===============================
# Nombre de partitions shuffle (défaut 200, adapter selon volume)
# En prod : ~ 2x le nombre de cores disponibles, ou tuner par job si très variable
spark.sql.shuffle.partitions = 200

# Compression shuffle (snappy = bon compromis vitesse/taille)
spark.shuffle.compress = true
spark.shuffle.spill.compress = true
spark.io.compression.codec = snappy


# ===============================
# Mémoire & Exécution
# ===============================
# Fraction de mémoire executor allouée à l'exécution (vs storage)
spark.memory.fraction= 0.8
spark.memory.storageFraction = 0.3

# Évite les OOM sur les joins/agrégations lourdes
spark.sql.execution.arrow.pyspark.enabled = true


# ===============================
# Logs & Monitoring
# ===============================
# Conserver les événements pour l'UI Spark History Server
spark.eventLog.enabled = true
spark.eventLog.dir = s3a://spark-logs/event-logs

# Compression des event logs pour économiser de l'espace
spark.eventLog.compress = true

# Niveau de log par défaut (WARN évite le bruit en prod)
spark.logLevel = WARN