<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Data Extractor</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>

    <div class="app-container">
        <header
            style="position: relative; text-align: center; padding: 1rem 0; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; min-height: 120px;">
            <!-- Top Left Logo (Second Logo) -->

            <!-- Main Center Logo & Title -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 1.5rem; text-align: left;">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Main Logo"
                    style="height: 110px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                <div>
                    <h1 style="margin-bottom: 0.2rem; font-size: 3.2rem;"><i class="fa-solid fa-file-pdf"></i> PDF Data
                        Extractor</h1>
                    <p style="margin: 0;">Upload a PDF to extract tables with AI-powered interpretation.</p>
                </div>
            </div>
        </header>

        <main>
            <!-- Upload -->
            <div class="upload-section glass-panel" id="upload-section">
                <div class="page-range-controls"
                    style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;">
                    <div
                        style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; width: 100%; max-width: 400px;">
                        <label for="page-input" style="font-weight: 600; font-size: 0.9rem;">Pages (Optional):</label>
                        <input type="text" id="page-input" placeholder="e.g. 1-5, 8, 11-13"
                            style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: inherit; font-family: inherit;">
                    </div>
                </div>
                <div class="upload-area" id="drop-zone">
                    <input type="file" id="file-input" accept=".pdf" hidden>
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <h2>Drag & Drop your PDF here</h2>
                    <p>or click to browse</p>
                </div>
                <div class="loading-state hidden" id="loading-state">
                    <div class="spinner"></div>
                    <p>Extracting tables, interpreting with AI... This may take a moment.</p>
                </div>
                <div class="error-message hidden" id="error-message"></div>
            </div>

            <!-- Results -->
            <div class="results-section glass-panel hidden" id="results-section">
                <div class="controls" style="flex-wrap: wrap;">
                    <!-- New Result Filter -->
                    <div class="result-filter-controls"
                        style="display: flex; gap: 0.5rem; align-items: center; width: 100%; margin-bottom: 0.5rem; background: rgba(255,255,255,0.05); padding: 0.5rem; border-radius: 6px;">
                        <label style="font-size: 0.85rem; font-weight: 600;"><i class="fa-solid fa-filter"></i> Filter
                            Extracted Results:</label>
                        <input type="text" id="filter-page-input" placeholder="e.g. 1-5, 8"
                            style="width: 150px; padding: 0.4rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: inherit; font-size: 0.85rem;">
                        <button id="apply-filter-btn" class="btn-secondary"
                            style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Apply</button>
                    </div>
                    <div class="indicator-select-wrapper" style="flex: 1; min-width: 300px; position: relative;">
                        <label>Select tables to include:</label>
                        <div class="custom-multiselect" id="custom-multiselect"
                            style="position: relative; cursor: pointer; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; margin-top: 0.4rem;">
                            <div class="multiselect-header" id="multiselect-header"
                                style="padding: 0.6rem; display: flex; justify-content: space-between; align-items: center;">
                                <span id="multiselect-header-text">Choose tables...</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <div class="multiselect-options hidden" id="multiselect-options"
                                style="position: absolute; top: 100%; left: 0; right: 0; background: #2c3e50; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; margin-top: 4px; z-index: 1000; max-height: 250px; overflow-y: auto;">
                                <!-- Checkboxes populated by JS -->
                            </div>
                        </div>
                    </div>
                    <button id="download-csv-btn" class="btn-primary" disabled>
                        <i class="fa-solid fa-download"></i> Download CSV
                    </button>
                    <button id="upload-new-btn" class="btn-secondary">
                        <i class="fa-solid fa-rotate-right"></i> Upload New
                    </button>
                </div>

                <!-- Dynamic Results List -->
                <div id="results-container" style="display: flex; flex-direction: column; gap: 2rem; margin-top: 1rem;">
                    <div class="empty-state" id="empty-selection-state"
                        style="position: static; transform: none; padding: 3rem 0;">
                        <i class="fa-solid fa-layer-group"></i>
                        <p>Select one or more items from the list above.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
