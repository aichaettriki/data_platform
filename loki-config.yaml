auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m
  chunk_block_size: 262144
  chunk_retain_period: 1h
  wal:
    enabled: true
    dir: /loki/wal

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  max_streams_per_user: 10000
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  retention_period: 2160h  # 90 jours
  max_query_length: 2160h  # Match retention period for full range queries

chunk_store_config:
  max_look_back_period: 2160h  # 90 jours (au lieu de 48h)

table_manager:
  retention_deletes_enabled: false  # Désactivé pour ne pas supprimer
  retention_period: 2160h  # 90 jours
