# --------- GRAPH STORAGE (INTERNAL) ---------
atlas.graph.storage.backend=hbase2
atlas.graph.storage.hostname=localhost
atlas.graph.storage.hbase.table=apache_atlas_janus
atlas.audit.hbase.tablename=apache_atlas_entity_audit
atlas.audit.hbase.zookeeper.quorum=localhost

# Performance Tuning (Fixes Stale Transactions)
atlas.graph.storage.lock.wait-time=60000
atlas.graph.storage.lock.retries=20
atlas.graph.storage.transactions-fast-property=false

# --------- SEARCH INDEX (INTERNAL) ---------
atlas.graph.index.search.backend=solr
atlas.graph.index.search.solr.mode=cloud
atlas.graph.index.search.solr.zookeeper-url=localhost:2181
# atlas.graph.index.search.solr.wait-searcher=true
atlas.graph.index.search.solr.wait-searcher=false


# --------- KAFKA MESSAGING (EXTERNAL) ---------
# This was the broken part. Now fixed:
atlas.notification.embedded=false
atlas.kafka.bootstrap.servers=kafka:9092
atlas.kafka.zookeeper.connect=zookeeper:2181
atlas.kafka.zookeeper.session.timeout.ms=60000
atlas.kafka.zookeeper.connection.timeout.ms=30000
atlas.kafka.enable.auto.commit=true

# Consumer Config
atlas.kafka.auto.offset.reset=earliest
# atlas.kafka.hook.group.id=spark_atlas_consumer_manual_fix
atlas.kafka.hook.group.id=spark_atlas_consumer_final_v8
atlas.notification.create.topics=true
atlas.notification.replicas=1
atlas.notification.topics=ATLAS_HOOK,ATLAS_ENTITIES
atlas.notification.relationships.enabled=true
atlas.notification.entity.enabled=true

# --------- SERVER CONFIG ---------
atlas.rest.address=http://localhost:21000
atlas.server.bind.address=0.0.0.0
atlas.server.http.port=21000