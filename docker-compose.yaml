


version: '3.8'

services:

#  # ---------- Traefik ----------
  traefik:
    image: traefik:2.10
    container_name: traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    restart: always


  # ------------------------
  # Redis
  # ------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - traefik-public
    ports:
      - "6379:6379"
    restart: always

  # ------------------------
  # PostgreSQL (Airflow)
  # ------------------------
  postgres-airflow:
    image: postgres:13
    networks:
      - traefik-public
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: always

  postgres-exporter:
    networks:
      - traefik-public
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      - postgres-airflow
    restart: always


  # ------------------------
  # Airflow Services
  # ------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      - postgres-airflow
    networks:
      - traefik-public
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: >
      bash -c "airflow db init &&
              airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --email admin@example.org --role Admin || echo 'User already exists' &&
              python /opt/airflow/init_connections.py"


  airflow-webserver:
    build: ./airflow
    networks:
      - traefik-public
    depends_on:
      - postgres-airflow
      - redis
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: airflow webserver
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.itceq.tn`)"
      - "traefik.http.routers.airflow.entrypoints=web"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"

  airflow-scheduler:
    build: ./airflow
    depends_on:
      - postgres-airflow
      - redis
    networks:
      - traefik-public
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs 
    command: airflow scheduler
    restart: always

  airflow-triggerer:
    build: ./airflow
    depends_on:
      - postgres-airflow
      - redis
    networks:
      - traefik-public
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: triggerer
    restart: always

  airflow-exporter:
      build: ./airflow/airflow-exporter
      networks:
        - traefik-public
      environment:
        EXPORTER_PORT: 9112
        AIRFLOW_WEBSERVER: "http://airflow-webserver:8080/api/v1"
        AIRFLOW_USER: "${AIRFLOW_ADMIN_USER}"
        AIRFLOW_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
        AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
        LOKI_URL: "http://loki:3100"
        METRICS_TIME_WINDOW_DAYS: "30"
      ports:
        - "9112:9112"
      volumes:
        - ./airflow/logs:/opt/airflow/logs:ro
      depends_on:
        - airflow-webserver
        - loki
      restart: always

  airflow-worker:
    build: ./airflow
    networks:
      - traefik-public
    depends_on:
      - postgres-airflow
      - redis
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
      SPARK_CONF_spark_atlas_cluster_name: "itceq_prod"
      SPARK_CONF_spark_atlas_rest_address: http://atlas-server:21000
      SPARK_CONF_spark_atlas_kafka_bootstrap_servers: kafka:9092
      SPARK_CONF_spark_extraListeners: com.hortonworks.spark.atlas.SparkAtlasEventTracker
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties
    command: celery worker
    restart: always

  # ------------------------
  # MinIO
  # ------------------------
  minio:
    image: minio/minio:latest
    networks:
      - traefik-public
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - ./minio:/data
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.itceq.tn`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

  minio-create-buckets:
    image: minio/mc:latest
    networks:
      - traefik-public
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb -p myminio/raw;
        mc mb -p myminio/transformed;
        mc mb -p myminio/refined;
        mc mb -p myminio/sandbox;
        mc ls myminio;
      "
    restart: "no"  
                                                
  # -------------------------------------------------------
  # Spark Services
  # -------------------------------------------------------
  spark-master:
    build: ./spark
    container_name: spark-master
    networks:
      - traefik-public
    user: root
    depends_on:
      - atlas-server
      - kafka
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_DAEMON_JAVA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=8090:/opt/jmx_exporter/config.yaml"
      SPARK_METRICS_CONF: "/opt/spark/conf/metrics.properties"

      # ATLAS CONFIGURATION
      SPARK_CONF_spark_extraListeners: com.hortonworks.spark.atlas.SparkAtlasEventTracker
      ATLAS_REST_ADDRESS: http://atlas-server:21000
      SPARK_CONF_spark_atlas_kafka_bootstrap_servers: kafka:9092
      SPARK_CONF_spark_atlas_rest_address: http://atlas-server:21000
      SPARK_CONF_spark_atlas_cluster_name: "itceq_prod" 
      
      SPARK_CONF_spark_sql_catalogImplementation: "hive"
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
      - "8090:8090"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
      - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spark.rule=Host(`spark.itceq.tn`)"
      - "traefik.http.routers.spark.entrypoints=web"
      - "traefik.http.services.spark.loadbalancer.server.port=8080"
     
  spark-worker:
    build: ./spark
    container_name: spark-worker
    networks:
      - traefik-public
    depends_on:
      - spark-master
      - kafka
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DAEMON_JAVA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=8091:/opt/jmx_exporter/config.yaml"
      SPARK_METRICS_CONF: "/opt/spark/conf/metrics.properties"
      ATLAS_REST_ADDRESS: http://atlas-server:21000
      SPARK_CONF_spark_atlas_cluster_name: "itceq_prod"
      SPARK_CONF_spark_sql_catalogImplementation: "hive"
      SPARK_CONF_spark_extraListeners: com.hortonworks.spark.atlas.SparkAtlasEventTracker
      SPARK_CONF_spark_atlas_kafka_bootstrap_servers: kafka:9092
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
      - "8091:8091"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
      - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties
    restart: always

  spark-exporter:
    build: ./spark/spark-exporter
    container_name: spark-exporter
    networks:
      - traefik-public
    depends_on:
      - spark-master
    ports:
      - "9091:9091"
    restart: always
 
  # ------------------------
  # Monitoring
  # ------------------------
  prometheus:
    image: prom/prometheus:latest
    networks:
      - traefik-public
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=365d'
      - '--storage.tsdb.retention.size=100GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.itceq.tn`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:10.0.3
    networks:
      - traefik-public
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${GRAFANA_PROVISIONING_PATH}:/etc/grafana/provisioning
      - ${GRAFANA_DASHBOARDS_PATH}:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.itceq.tn`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:2.8.2
    networks:
      - traefik-public
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-data/index:/loki/index
      - ./loki-data/chunks:/loki/chunks
      - ./loki-data/wal:/loki/wal
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    restart: always
 
  promtail:
    image: grafana/promtail:2.9.0
    networks:
      - traefik-public
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./airflow/logs:/opt/airflow/logs:ro
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yaml
    restart: always

  # ------------------------
  # Metabase
  # ------------------------
  metabase:
    build:
      context: ./metabase/build
      dockerfile: Dockerfile
    container_name: metabase_app
    networks:
      - traefik-public
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./metabase/env/metabase.env
    depends_on:
      metabase_db_internal:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.itceq.tn`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    
  metabase_db_internal:
    image: postgres:15
    networks:
      - traefik-public
    container_name: metabase_db_internal
    environment:
      POSTGRES_DB: metabase_internal
      POSTGRES_USER: mb_internal_user
      POSTGRES_PASSWORD: mb_internal_pass
    volumes:
      - mb_internal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb_internal_user -d metabase_internal"]
      interval: 5s
      retries: 5
    
  metabase-exporter:
    build: ./metabase/metabase-exporter
    container_name: metabase-exporter
    networks:
      - traefik-public
    environment:
      METABASE_URL: "http://metabase:3000"
      METABASE_USERNAME: "admin@example.com"
      METABASE_PASSWORD: "AdminPass123"
      EXPORTER_PORT: "9101"
      SCRAPE_INTERVAL: "30"
    ports:
      - "9101:9101"
    depends_on:
      - metabase
    restart: always
 
  metabase_deployer:
    image: python:3.9-slim
    networks:
      - traefik-public
    container_name: metabase_deployer
    depends_on:
      - metabase
    volumes:
      - ./metabase/scripts:/scripts
      - ./metabase/saved_states:/saved_states
    working_dir: /scripts
    env_file:
      - ./metabase/env/metabase.env
    command: >
      sh -c "pip install requests metabase-api && python deploy_solution.py"

  pgadmin:
    image: dpage/pgadmin4:latest
    networks:
      - traefik-public
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${PGADMIN_SERVERS_PATH}:/pgadmin4/servers.json
    depends_on:
      - postgres-airflow
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.itceq.tn`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # -------------------------------------------------------
  # SERVICES FOR APACHE ATLAS
  # -------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks:
      - traefik-public
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    networks:
      - traefik-public
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: always

  
  


  atlas-server:
    image: sburn/apache-atlas:2.3.0
    container_name: atlas-server
    networks:
      - traefik-public
    depends_on:
      - zookeeper
      - kafka
    ports:
      - "21000:21000"
    environment:
      # --- HYBRID SETUP ---
      # Keep Internal Storage ON
      MANAGE_LOCAL_ZK: "true"
      MANAGE_LOCAL_HBASE: "true"
      MANAGE_LOCAL_SOLR: "true"
      # Disable Internal Kafka (We are using the config file to point to external)
      MANAGE_LOCAL_KAFKA: "false"
      
      ATLAS_SERVER_OPTS: "-Xms2048m -Xmx3072m"
      ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Ensure Atlas server knows it's part of the same cluster
      ATLAS_CLUSTER_NAME: "itceq_prod"
      
    volumes:
      # 1. MOUNT YOUR EDITED FILE (Crucial Step)
      # Ensure 'atlas-application.properties' is in the same folder as docker-compose.yaml
      - ./atlas-application.properties:/apache-atlas/conf/atlas-application.properties
      
      # 2. Persistent Data (Use v3 or v20, whichever is clean)
      - atlas_storage_final_v3:/root/atlas-bin/data
      
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atlas.rule=Host(`atlas.itceq.tn`)"
      - "traefik.http.routers.atlas.entrypoints=web"
      - "traefik.http.services.atlas.loadbalancer.server.port=21000"
  atlas-init:
    image: curlimages/curl:latest
    networks:
      - traefik-public
    depends_on:
      - atlas-server
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Waiting for Atlas API..."
        until curl -s -u admin:admin http://atlas-server:21000/api/atlas/v2/types/typedefs > /dev/null; do
          sleep 5
        done

        echo "✅ Atlas is UP! Defining COMPLETE Spark Model..."
        
        # Create the FULL JSON model file
        cat <<EOF > /tmp/spark_model.json
        {
          "enumDefs": [],
          "structDefs": [],
          "classificationDefs": [],
          "entityDefs": [
            {
              "name": "spark_db",
              "superTypes": ["DataSet"],
              "serviceType": "spark",
              "typeVersion": "1.0",
              "attributeDefs": [
