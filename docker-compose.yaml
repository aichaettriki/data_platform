version: '3.8'

services:

  # ------------------------
  # PostgreSQL pour Airflow
  # ------------------------
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5435:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d   # <-- to initialize metabase intern bd
    restart: always

  # ------------------------
  # PostgreSQL Exporter pour Prometheus
  # ------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # Connexion au PostgreSQL Airflow
      DATA_SOURCE_NAME: "postgresql://airflow:airflow@postgres-airflow:5432/airflow?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres-airflow
    restart: always


  # ------------------------
  # Airflow Initialization (Windows friendly)
  # ------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: mysecretkey123
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark/jobs:/opt/spark/jobs  
    command: >
      bash -c "airflow db init &&
              airflow users create --username admin --password admin123 --firstname Admin --lastname Admin --email admin@example.org --role Admin || echo 'User already exists' &&
              python /opt/airflow/init_connections.py"


  # ------------------------
  # Airflow Webserver
  # ------------------------
  airflow-webserver:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: mysecretkey123
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      # AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./minio/raw:/data/raw
      - ./minio/transformed:/data/transformed
      - ./data:/opt/airflow/data
      - ./spark/jobs:/opt/spark/jobs  

    command: airflow webserver
    restart: always

  # ------------------------
  # Airflow Scheduler
  # ------------------------
  airflow-scheduler:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: mysecretkey123
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      # AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./minio/raw:/data/raw
      - ./minio/transformed:/data/transformed
      - ./data:/opt/airflow/data
      - ./spark/jobs:/opt/spark/jobs  
    command: airflow scheduler

    restart: always

  # ------------------------
  # Airflow Triggerer
  # ------------------------
  airflow-triggerer:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: mysecretkey123
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./minio/raw:/data/raw
      - ./minio/transformed:/data/transformed
      - ./data:/opt/airflow/data
      - ./spark/jobs:/opt/spark/jobs  
    command: triggerer
    restart: always

  # ------------------------
  # Airflow Exporter
  # ------------------------
  airflow-exporter:
      build: ./airflow/airflow-exporter
      environment:
        EXPORTER_PORT: 9112
        AIRFLOW_WEBSERVER: "http://airflow-webserver:8080/api/v1"
        AIRFLOW_USER: "admin"
        AIRFLOW_PASSWORD: "admin123"
      ports:
        - "9112:9112"
      depends_on:
        - airflow-webserver
      restart: always

  # ------------------------
  # MinIO pour stockage
  # ------------------------
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    command: server /data --console-address ":9001"
    volumes:
      - ./minio:/data   # raw + transformed
    restart: always
                                                
  # ------------------------
  # Spark
  # ------------------------
  spark-master:
    build: ./spark
    container_name: spark-master
    user: root
    environment:
      - USER=root
      - SPARK_USER=root
      - HADOOP_USER_NAME=root
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark cluster port
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077
    volumes:
      - ./minio/raw:/data/raw
      - ./minio/transformed:/data/transformed
      - ./minio/refined:/data/refined
      - ./spark/jobs:/opt/spark/jobs
    restart: always
  spark-worker:
    build: ./spark
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - USER=root
      - SPARK_USER=root
      - HADOOP_USER_NAME=root
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8081:8081"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ./minio/raw:/data/raw
      - ./minio/transformed:/data/transformed
      - ./minio/refined:/data/refined
      - ./spark/jobs:/opt/spark/jobs
    restart: always
 
  # ------------------------
  # Prometheus
  # ------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  # ------------------------
  # Grafana
  # ------------------------
  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "3000:3000"
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    restart: always

  # ------------------------
  # Metabase
  # ------------------------
  metabase:
    build:
      context: ./metabase
    container_name: metabase
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - ./metabase/env/metabase.env
    depends_on:
      - postgres-airflow
  # ------------------------
  # pgAdmin pour PostgreSQL
  # ------------------------
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgpass
    depends_on:
      - postgres-airflow
    restart: always


