version: '3.8'

services:

#  # ---------- Traefik ----------
  traefik:
    image: traefik:2.10
    container_name: traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    restart: always


#   # ---------- CoreDNS ----------
  # coredns:
  #   image: coredns/coredns:1.11.1
  #   command: -conf /Corefile
  #   ports:
  #     - "1053:53/udp"
  #     - "1053:53/tcp"
  #   volumes:
  #     - ./coredns/Corefile:/Corefile
  #     - ./coredns/hosts:/hosts
  #   restart: always
  #   networks:
  #     - traefik-public
    


  # ------------------------
  # PostgreSQL pour Airflow
  # ------------------------
  postgres-airflow:
    image: postgres:13
    networks:
      - traefik-public
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d   # <-- to initialize metabase intern bd

    restart: always

  # ------------------------
  # PostgreSQL Exporter pour Prometheus
  # ------------------------
  postgres-exporter:
    networks:
      - traefik-public
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # Connexion au PostgreSQL Airflow
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      - postgres-airflow
    restart: always


  # ------------------------
  # Airflow Initialization (Windows friendly)
  # ------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      - postgres-airflow
    networks:
      - traefik-public
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: >
      bash -c "airflow db init &&
              airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --email admin@example.org --role Admin || echo 'User already exists' &&
              python /opt/airflow/init_connections.py"


  # ------------------------
  # Airflow Webserver
  # ------------------------
  airflow-webserver:
    build: ./airflow
    networks:
      - traefik-public
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: airflow webserver
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.itceq.tn`)"
      - "traefik.http.routers.airflow.entrypoints=web"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"

    

  # ------------------------
  # Airflow Scheduler
  # ------------------------
  airflow-scheduler:
    build: ./airflow
    depends_on:
      - postgres-airflow
    networks:
      - traefik-public
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs 
    command: airflow scheduler

    restart: always

  # ------------------------
  # Airflow Triggerer
  # ------------------------
  airflow-triggerer:
    build: ./airflow
    depends_on:
      - postgres-airflow
    networks:
      - traefik-public
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: triggerer
    restart: always

  # ------------------------
  # Airflow Exporter
  # ------------------------
  airflow-exporter:
      build: ./airflow/airflow-exporter
      environment:
        EXPORTER_PORT: 9112
        AIRFLOW_WEBSERVER: "http://airflow-webserver:8080/api/v1"
        AIRFLOW_USER: "${AIRFLOW_ADMIN_USER}"
        AIRFLOW_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
      ports:
        - "9112:9112"
      depends_on:
        - airflow-webserver
      restart: always


  airflow-worker:
    build: ./airflow
    networks:
      - traefik-public
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: celery worker
    restart: always
  # ------------------------
  # MinIO pour stockage
  # ------------------------
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    networks:
      - traefik-public
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /minio-data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - ./minio:/data   # raw + transformed
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.itceq.tn`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

  # -------------------------------------------------------
  # MinIO - Create default buckets at startup
  # -------------------------------------------------------
  minio-create-buckets:
    image: minio/mc:latest
    networks:
      - traefik-public
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb -p myminio/raw;
        mc mb -p myminio/transformed;
        mc mb -p myminio/refined;
        mc mb -p myminio/sandbox;
        mc ls myminio;
      "
    restart: "no"

                                       
  # ------------------------
  # Spark
  # ------------------------
  spark-master:
    build: ./spark
    networks:
      - traefik-public
    container_name: spark-master
    user: root
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spark.rule=Host(`spark.itceq.tn`)"
      - "traefik.http.routers.spark.entrypoints=web"
      - "traefik.http.services.spark.loadbalancer.server.port=8080"


  spark-worker:
    build: ./spark
    networks:
      - traefik-public
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    restart: always
 
  # ------------------------
  # Prometheus
  # ------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    networks:
      - traefik-public
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH}:/etc/prometheus/prometheus.yml
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.itceq.tn`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
  # ------------------------
  # Grafana
  # ------------------------
  grafana:
    image: grafana/grafana:10.0.3
    networks:
      - traefik-public
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${GRAFANA_PROVISIONING_PATH}:/etc/grafana/provisioning
      - ${GRAFANA_DASHBOARDS_PATH}:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.itceq.tn`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
  # ------------------------
  # Metabase
  # ------------------------
  metabase:
    build: ./metabase
    container_name: metabase
    networks:
      - traefik-public
    restart: always
    ports:
      - "${METABASE_PORT}:3000"
    env_file:
      - ${METABASE_ENV_FILE}
    depends_on:
      - postgres-airflow
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.itceq.tn`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
  # ------------------------
  # pgAdmin
  # ------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    networks:
      - traefik-public
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${PGADMIN_SERVERS_PATH}:/pgadmin4/servers.json
    depends_on:
      - postgres-airflow
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.itceq.tn`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"


networks:
  traefik-public:
    driver: bridge