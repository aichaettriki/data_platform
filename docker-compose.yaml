version: '3.8'

services:

  # ------------------------
  # PostgreSQL pour Airflow
  # ------------------------
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
    restart: always

  # ------------------------
  # PostgreSQL Exporter pour Prometheus
  # ------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      - postgres-airflow
    restart: always

  # ------------------------
  # Airflow Initialization
  # ------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: >
      bash -c "airflow db init &&
               airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --email admin@example.org --role Admin || echo 'User already exists'"

  # ------------------------
  # Airflow Webserver
  # ------------------------
  airflow-webserver:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: airflow webserver
    restart: always

  # ------------------------
  # Airflow Scheduler
  # ------------------------
  airflow-scheduler:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: airflow scheduler
    restart: always

  # ------------------------
  # Airflow Triggerer
  # ------------------------
  airflow-triggerer:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: triggerer
    restart: always

  # ------------------------
  # Airflow Exporter
  # ------------------------
  airflow-exporter:
    build: ./airflow/airflow-exporter
    environment:
      EXPORTER_PORT: 9112
      AIRFLOW_WEBSERVER: "http://airflow-webserver:8080/api/v1"
      AIRFLOW_USER: "${AIRFLOW_ADMIN_USER}"
      AIRFLOW_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
    ports:
      - "9112:9112"
    depends_on:
      - airflow-webserver
    restart: always

  # ------------------------
  # MinIO
  # ------------------------
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_BROWSER: "on"
      MINIO_API_REQUESTS_MAX: "16000"
      MINIO_FS_OSYNC: "false"
      MINIO_DISK_HEALTH_CHECK_INTERVAL: "2m"
      MINIO_DISK_HEALTH_THRESHOLD: "5m"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /minio-data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - ./minio:/minio-data
    restart: always


  # ------------------------
  # Spark
  # ------------------------
  spark-master:
    build: ./spark
    container_name: spark-master
    user: root
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    restart: always

  spark-worker:
    build: ./spark
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    restart: always

  # ------------------------
  # Prometheus
  # ------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH}:/etc/prometheus/prometheus.yml
    restart: always

  # ------------------------
  # Grafana
  # ------------------------
  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${GRAFANA_PROVISIONING_PATH}:/etc/grafana/provisioning
      - ${GRAFANA_DASHBOARDS_PATH}:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always

  # ------------------------
  # Metabase
  # ------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "${METABASE_PORT}:3000"
    env_file:
      - ${METABASE_ENV_FILE}
    depends_on:
      - postgres-airflow

  # ------------------------
  # pgAdmin
  # ------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${PGADMIN_SERVERS_PATH}:/pgadmin4/servers.json
    depends_on:
      - postgres-airflow
    restart: always

  amundsen-frontend:
    image: amundsendev/amundsen-frontend:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - METADATASERVICE_BASE=http://amundsen-metadata:5002
      - SEARCHSERVICE_BASE=http://amundsen-search:5001
    depends_on:
      - amundsen-metadata
      - amundsen-search
    restart: always

  amundsen-metadata:
    image: amundsendev/amundsen-metadata:latest
    ports:
      - "5002:5002"
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/amundsen
    depends_on:
      - postgres-airflow
    restart: always

  amundsen-search:
    image: amundsendev/amundsen-search:latest
    ports:
      - "5001:5001"
    environment:
      - SEARCH_ENGINE=elasticsearch
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    depends_on:
      - elasticsearch
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    restart: always

  # atlas:
  #   image: apache/atlas:2.2.0
  #   environment:
  #     - ATLAS_GRAPH_STORAGE_BACKEND=janusgraph
  #     - ATLAS_REPOSITORY_DIR=/var/lib/atlas/repository
  #     - ATLAS_LOG_DIR=/var/log/atlas
  #     - JAVA_OPTS=-Xms512m -Xmx1024m
  #     - ATLAS_DB_HOST=postgres-airflow
  #     - ATLAS_DB_PORT=5432
  #     - ATLAS_DB_USERNAME=${POSTGRES_USER}
  #     - ATLAS_DB_PASSWORD=${POSTGRES_PASSWORD}
  #     - ATLAS_DB_NAME=atlas
  #   ports:
  #     - "21000:21000"  # REST API
  #     - "21443:21443"  # Optional web UI HTTPS
  #   depends_on:
  #     - postgres-airflow
  #   volumes:
  #     - ./atlas-data:/var/lib/atlas/repository
  #     - ./atlas-logs:/var/log/atlas
  #   restart: always

  atlas:
    image: sburn/apache-atlas:latest
    ports:
      - "21000:21000"  # REST API
    environment:
      - ATLAS_OPTS=-Xms512m -Xmx1024m
    depends_on:
      - hbase
      - solr
    volumes:
      - ./atlas-data:/apache-atlas/data
    restart: always

  solr:
    image: solr:8.11
    command: solr-precreate vertex_index
    ports:
      - "8983:8983"
    volumes:
      - ./solr-data:/var/solr
    restart: always

  hbase:
    image: harisekhon/hbase
    ports:
      - "16000:16000"
      - "16010:16010"
    volumes:
      - ./hbase-data:/hbase-data
    restart: always
