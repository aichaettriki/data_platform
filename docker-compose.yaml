  #     # Changing this name (e.g. to 'v20') tricks Kafka into sending ALL previous messages again.
  #     ATLAS_SERVER_CONF_atlas_kafka_hook_group_id: spark_atlas_consumer_RESET_v20
     
  #     # 5. Define the Topic Explicitly
  #     ATLAS_SERVER_CONF_atlas_notification_hook_topic_name: ATLAS_HOOK
     
  #     # 6. Performance Tuning (Prevent the 503 Crash)
  #     ATLAS_SERVER_OPTS: "-Xms2048m -Xmx3072m"
  #     ATLAS_SERVER_CONF_atlas_graph_storage_lock_wait_time: 60000
  #     ATLAS_SERVER_CONF_atlas_graph_index_search_solr_wait_searcher: "false"
 
  #   # Use your existing volume (assuming it is not corrupt)
  #   volumes:
  #     - atlas_storage_data_v15:/root/atlas-bin/data
     
  #   restart: always
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.atlas.rule=Host(`atlas.itceq.tn`)"
  #     - "traefik.http.routers.atlas.entrypoints=web"
  #     - "traefik.http.services.atlas.loadbalancer.server.port=21000"


  atlas-server:
    image: sburn/apache-atlas:2.3.0
    container_name: atlas-server
    networks:
      - traefik-public
    depends_on:
      - zookeeper
      - kafka
    ports:
      - "21000:21000"
    environment:
      # --- HYBRID SETUP ---
      # Keep Internal Storage ON
      MANAGE_LOCAL_ZK: "true"
      MANAGE_LOCAL_HBASE: "true"
      MANAGE_LOCAL_SOLR: "true"
      # Disable Internal Kafka (We are using the config file to point to external)
      MANAGE_LOCAL_KAFKA: "false"
      
      ATLAS_SERVER_OPTS: "-Xms2048m -Xmx3072m"
      
    volumes:
      # 1. MOUNT YOUR EDITED FILE (Crucial Step)
      # Ensure 'atlas-application.properties' is in the same folder as docker-compose.yaml
      - ./atlas-application.properties:/apache-atlas/conf/atlas-application.properties
      
      # 2. Persistent Data (Use v3 or v20, whichever is clean)
      - atlas_storage_final_v3:/root/atlas-bin/data
      
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atlas.rule=Host(`atlas.itceq.tn`)"
      - "traefik.http.routers.atlas.entrypoints=web"
      - "traefik.http.services.atlas.loadbalancer.server.port=21000"
  atlas-init:
    image: curlimages/curl:latest
    networks:
      - traefik-public
    depends_on:
      - atlas-server
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Waiting for Atlas API..."
        until curl -s -u admin:admin http://atlas-server:21000/api/atlas/v2/types/typedefs > /dev/null; do
          sleep 5
        done

        echo "✅ Atlas is UP! Defining COMPLETE Spark Model..."
        
        # Create the FULL JSON model file
        cat <<EOF > /tmp/spark_model.json
        {
          "enumDefs": [],
          "structDefs": [],
          "classificationDefs": [],
          "entityDefs": [
            {
              "name": "spark_db",
              "superTypes": ["DataSet"],
              "serviceType": "spark",
              "typeVersion": "1.0",
              "attributeDefs": [
                { "name": "clusterName", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "location", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "parameters", "typeName": "map<string,string>", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false }
              ]
            },
            {
              "name": "spark_storagedesc",
              "superTypes": ["DataSet"],
              "serviceType": "spark",
              "typeVersion": "1.0",
              "attributeDefs": [
                { "name": "location", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "inputFormat", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "outputFormat", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "serde", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "compressed", "typeName": "boolean", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "parameters", "typeName": "map<string,string>", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false }
              ]
            },
            {
              "name": "spark_table",
              "superTypes": ["DataSet"],
              "serviceType": "spark",
              "typeVersion": "1.0",
              "attributeDefs": [
                { "name": "db", "typeName": "spark_db", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "sd", "typeName": "spark_storagedesc", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "createTime", "typeName": "date", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "tableType", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "schemaDesc", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "parameters", "typeName": "map<string,string>", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "partitionColumnNames", "typeName": "array<string>", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "provider", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false }
              ]
            },
            {
              "name": "spark_process",
              "superTypes": ["Process"],
              "serviceType": "spark",
              "typeVersion": "1.0",
              "attributeDefs": [
                { "name": "executionId", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "currUser", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "remoteUser", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "details", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false },
                { "name": "sparkPlanDescription", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false }
              ]
            },
            {
              "name": "spark_column_lineage",
              "superTypes": ["Process"],
              "serviceType": "spark",
              "typeVersion": "1.0",
              "attributeDefs": [
                { "name": "depenendencyType", "typeName": "string", "cardinality": "SINGLE", "isIndexable": true, "isOptional": true, "isUnique": false },
                { "name": "expression", "typeName": "string", "cardinality": "SINGLE", "isIndexable": false, "isOptional": true, "isUnique": false }
              ]
            }
          ]
        }
        EOF

        echo "🚀 Uploading Model..."
        # NOTE: We use $$ here to prevent Docker Compose from trying to interpret it
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin -X POST -H "Content-Type: application/json" -d @/tmp/spark_model.json http://atlas-server:21000/api/atlas/v2/types/typedefs)

        if [ "$$HTTP_CODE" -eq 200 ]; then
          echo "🎉 Success! Spark Model (Tables & DBs) registered."
        elif [ "$$HTTP_CODE" -eq 409 ]; then
          echo "👌 Model already exists. Skipping."
        else
          echo "❌ Error registering model. HTTP Code: $$HTTP_CODE"
        fi

volumes:
  mb_internal_data:
  pg_dwh_data:
  prometheus_data:
  # Updated Volume Name
  atlas_storage_final_v3:

networks:
  traefik-public:
    driver: bridge