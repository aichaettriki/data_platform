version: '3.8'

# 1. Common Environment Variables for Airflow
x-airflow-common-env: &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  OPENLINEAGE_URL: http://itceq-marquez:5000
  OPENLINEAGE_NAMESPACE: itceq_prod

# 2. Common Service Settings for Airflow
x-airflow-common: &airflow-common
  image: itceq-platform/airflow-custom:latest
  networks:
    - itceq-net
  volumes:
    - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
    - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
    - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties

services:

  # --- INFRASTRUCTURE ---
  traefik:
    image: traefik:2.10
    container_name: itceq-proxy
    command: [--api.insecure=true, --providers.docker=true, --entrypoints.web.address=:80]
    ports: ["80:80", "8082:8080"]
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    networks: [itceq-net]

  redis:
    image: redis:7-alpine
    container_name: itceq-redis
    networks: [itceq-net]

  db-airflow:
    image: postgres:13
    container_name: itceq-db-airflow
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [airflow_db_data:/var/lib/postgresql/data]
    networks: [itceq-net]

  minio:
    image: minio/minio:latest
    container_name: itceq-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    networks: [itceq-net]

  # --- LINEAGE & METADATA ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks: [itceq-net]
    environment: {ZOOKEEPER_CLIENT_PORT: 2181}

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    networks: [itceq-net]
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  atlas-server:
    image: sburn/apache-atlas:2.3.0
    container_name: itceq-atlas
    networks: [itceq-net]
    depends_on: [kafka]
    ports: ["21000:21000"]
    volumes:
      - ./atlas-application.properties:/apache-atlas/conf/atlas-application.properties
      - atlas_data:/root/atlas-bin/data
    environment:
      ATLAS_SERVER_OPTS: "-Xms2048m -Xmx3072m"
      MANAGE_LOCAL_KAFKA: "false"

  postgres:
    image: postgres:14-alpine
    container_name: itceq-postgres
    networks: [itceq-net]
    ports: ["5432:5432"]
    environment:
      - POSTGRES_DB=marquez
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 5

  marquez:
    image: marquezproject/marquez:0.49.0
    container_name: itceq-marquez
    # PORTS REMOVED - Nginx will handle them
    networks:
      - itceq-net
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      - MARQUEZ_CONFIG=marquez.dev.yml
      - MARQUEZ_DB_URL=jdbc:postgresql://postgres:5432/marquez
      - MARQUEZ_DB_USER=marquez
      - MARQUEZ_DB_PASSWORD=marquez

  marquez-web:
    image: marquezproject/marquez-web:0.41.0
    container_name: itceq-marquez-ui
    # PORTS REMOVED - Nginx will handle them
    networks:
      - itceq-net
    depends_on:
      - marquez

  # --- THE GATEKEEPER (THE FIX) ---
  marquez-proxy:
    image: nginx:alpine
    container_name: itceq-marquez-proxy
    ports:
      - "3002:80"  # You will access the graph here
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - itceq-net
    depends_on:
      - marquez
      - marquez-web

  # --- SPARK (MASTER) ---
  spark-master:
    build: ./spark
    image: itceq-platform/spark-custom:latest
    container_name: itceq-spark-master
    hostname: itceq-spark-master
    networks: [itceq-net]
    ports: ["8080:8080", "7077:7077"]
    # CLEANED ENVIRONMENT
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host itceq-spark-master --port 7077
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs

  spark-worker:
    image: itceq-platform/spark-custom:latest
    container_name: itceq-spark-worker
    networks: [itceq-net]
    depends_on: [spark-master]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://itceq-spark-master:7077
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://itceq-spark-master:7077
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs

  # --- AIRFLOW ---
  airflow-init:
    <<: *airflow-common
    build: ./airflow
    container_name: itceq-airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  airflow-webserver:
    <<: *airflow-common
    container_name: itceq-airflow-web
    command: webserver
    ports: ["8085:8080"]
    environment: { <<: *airflow-common-env }
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    container_name: itceq-airflow-scheduler
    command: scheduler
    environment: { <<: *airflow-common-env }
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-worker:
    <<: *airflow-common
    container_name: itceq-airflow-worker
    command: celery worker
    environment: { <<: *airflow-common-env }
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # --- VISUALIZATION ---
  metabase:
    image: metabase/metabase:latest
    container_name: itceq-metabase
    networks: [itceq-net]
    ports: ["3001:3000"]
    depends_on: [db-metabase]

  db-metabase:
    image: postgres:15
    container_name: db-metabase
    networks: [itceq-net]
    environment:
      - POSTGRES_DB=metabase
      - POSTGRES_USER=mb_user
      - POSTGRES_PASSWORD=mb_pass

networks:
  itceq-net:
    driver: bridge

volumes:
  airflow_db_data:
  minio_data:
  atlas_data: