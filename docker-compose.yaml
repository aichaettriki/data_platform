version: '3.8'

services:

  # ------------------------
  # PostgreSQL pour Airflow
  # ------------------------
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d   # <-- to initialize metabase intern bd

    restart: always

  # ------------------------
  # PostgreSQL Exporter pour Prometheus
  # ------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # Connexion au PostgreSQL Airflow
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      - postgres-airflow
    restart: always


  # ------------------------
  # Airflow Initialization (Windows friendly)
  # ------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: >
      bash -c "airflow db init &&
              airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --email admin@example.org --role Admin || echo 'User already exists' &&
              python /opt/airflow/init_connections.py"


  # ------------------------
  # Airflow Webserver
  # ------------------------
  airflow-webserver:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs

    command: airflow webserver
    restart: always

  # ------------------------
  # Airflow Scheduler
  # ------------------------
  airflow-scheduler:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs 
    command: airflow scheduler

    restart: always

  # ------------------------
  # Airflow Triggerer
  # ------------------------
  airflow-triggerer:
    build: ./airflow
    depends_on:
      - postgres-airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth

    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: triggerer
    restart: always

  # ------------------------
  # Airflow Exporter
  # ------------------------
  airflow-exporter:
      build: ./airflow/airflow-exporter
      environment:
        EXPORTER_PORT: 9112
        AIRFLOW_WEBSERVER: "http://airflow-webserver:8080/api/v1"
        AIRFLOW_USER: "${AIRFLOW_ADMIN_USER}"
        AIRFLOW_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
        AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
        LOKI_URL: "http://loki:3100"
        METRICS_TIME_WINDOW_DAYS: "30"  # Période de filtrage des métriques (peut être modifiée)
      ports:
        - "9112:9112"
      volumes:
        - ./airflow/logs:/opt/airflow/logs:ro
      depends_on:
        - airflow-webserver
        - loki
      restart: always

  # ------------------------
  # MinIO pour stockage
  # ------------------------
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - ./minio:/data   # raw + transformed
    restart: always
  minio-create-buckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb -p myminio/raw;
        mc mb -p myminio/transformed;
        mc mb -p myminio/refined;
        mc mb -p myminio/sandbox;
        mc ls myminio;
      "
    restart: "no"  
                                                
  spark-master:
    build: ./spark
    container_name: spark-master
    user: root
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    restart: always
    
  # ------------------------
  # Spark Workers
  # ------------------------
  spark-worker:
    build: ./spark
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    restart: always
 

  # ------------------------
  # Prometheus
  # ------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=365d'  # 1 an de rétention (au lieu de 90j)
      - '--storage.tsdb.retention.size=100GB'  # 100GB max (au lieu de 50GB)
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"


  # ------------------------
  # Grafana
  # ------------------------
  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${GRAFANA_PROVISIONING_PATH}:/etc/grafana/provisioning
      - ${GRAFANA_DASHBOARDS_PATH}:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always

  # ------------------------
  # Metabase
  # ------------------------
    # 1. METABASE APP (Port 3021)
  metabase:
    build:
      context: ./metabase/build
      dockerfile: Dockerfile
    container_name: metabase_app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./metabase/env/metabase.env
    depends_on:
      metabase_db_internal:
        condition: service_healthy
    
 
  # 2. INTERNAL METADATA DB
  metabase_db_internal:
    image: postgres:15
    container_name: metabase_db_internal
    environment:
      POSTGRES_DB: metabase_internal
      POSTGRES_USER: mb_internal_user
      POSTGRES_PASSWORD: mb_internal_pass
    volumes:
      - mb_internal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb_internal_user -d metabase_internal"]
      interval: 5s
      retries: 5
    
 
  # 3. ZERO-TOUCH DEPLOYER (The Magic)
  metabase_deployer:
    image: python:3.9-slim
    container_name: metabase_deployer
    depends_on:
      - metabase
    volumes:
      - ./metabase/scripts:/scripts
      - ./metabase/saved_states:/saved_states # Mounts the JSONs
    working_dir: /scripts
    env_file:
      - ./metabase/env/metabase.env
    # Install libs -> Run Setup -> Run Import -> Exit
    command: >
      sh -c "pip install requests metabase-api && python deploy_solution.py"
 
 


  # ------------------------
  # pgAdmin
  # ------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${PGADMIN_SERVERS_PATH}:/pgadmin4/servers.json
    depends_on:
      - postgres-airflow
    restart: always


  # ------------------------
  # Loki (pour logs Airflow)
  # ------------------------
  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-data/index:/loki/index
      - ./loki-data/chunks:/loki/chunks
      - ./loki-data/wal:/loki/wal
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      
    restart: always
 
  # ------------------------
  # Promtail (agent qui envoie les logs à Loki)
  # ------------------------
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./airflow/logs:/opt/airflow/logs:ro
      # Pas de volume persistant pour positions - force la relecture à chaque restart
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yaml
    restart: always

volumes:
  mb_internal_data:
  pg_dwh_data:
  prometheus_data: