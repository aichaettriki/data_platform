version: '3.8'
# 1. Common Environment Variables for Airflow
x-airflow-common-env: &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  OPENLINEAGE_URL: http://itceq-marquez:5000
  OPENLINEAGE_NAMESPACE: itceq_prod

# 2. Common Service Settings for Airflow
x-airflow-common: &airflow-common
  image: itceq-platform/airflow-custom:latest
  networks:
    - itceq-net
  volumes:
    - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
    - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
    - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    - ./atlas-application.properties:/opt/spark/conf/atlas-application.properties
    
services:

#  # ---------- Traefik ----------
  traefik:
    image: traefik:2.10
    container_name: traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    restart: always


  # ------------------------
  # Redis (broker pour Celery)
  # ------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - traefik-public
    ports:
      - "6379:6379"
    restart: always

  # ------------------------
  # PostgreSQL pour Airflow
  # ------------------------
  postgres-airflow:
    image: postgres:13
    networks:
      - traefik-public
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d   # <-- to initialize metabase intern bd

    restart: always

  # ------------------------
  # PostgreSQL Exporter pour Prometheus
  # ------------------------
  postgres-exporter:
    networks:
      - traefik-public
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # Connexion au PostgreSQL Airflow
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      - postgres-airflow
    restart: always


  # ------------------------
  # Airflow Initialization (Windows friendly)
  # ------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      - postgres-airflow
    networks:
      - traefik-public
    environment:
      # OpenLineage
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://openmetadata-server:8585/api/v1/lineage"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: 'itceq_airflow'
      AIRFLOW__OPENLINEAGE__DISABLED: 'False'
      AIRFLOW__CORE__ENABLE_OPENLINEAGE: 'True'
      # reste de tes variables Airflow existantes
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: >
      bash -c "airflow db upgrade &&
              airflow db init &&
              airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --email admin@example.org --role Admin || echo 'User already exists' &&
              python /opt/airflow/init_connections.py"


  # ------------------------
  # Airflow Webserver
  # ------------------------
  airflow-webserver:
    build: ./airflow
    networks:
      - traefik-public
    depends_on:
      - postgres-airflow
      - redis
    environment:
      # AIRFLOW__OPENLINEAGE__TRANSPORT déjà défini, doublon supprimé
      # AIRFLOW__OPENLINEAGE__NAMESPACE déjà défini, doublon supprimé
      # AIRFLOW__OPENLINEAGE__DISABLED déjà défini, doublon supprimé
      AIRFLOW__CORE__ENABLE_OPENLINEAGE: 'True'
      # reste de tes variables Airflow existantes
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'

      # Add/Update these in Airflow services
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://openmetadata-server:8585/api/v1/lineage"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: 'itceq_airflow'
      # Ensure this is set to False (it is enabled by default in recent providers)
      AIRFLOW__OPENLINEAGE__DISABLED: 'False'
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: airflow webserver
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.itceq.tn`)"
      - "traefik.http.routers.airflow.entrypoints=web"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"

  # ------------------------
  # Airflow Scheduler
  # ------------------------
  airflow-scheduler:
    build: ./airflow
    depends_on:
      - postgres-airflow
      - redis
    networks:
      - traefik-public
    environment:
      # AIRFLOW__OPENLINEAGE__TRANSPORT déjà défini, doublon supprimé
      # AIRFLOW__OPENLINEAGE__NAMESPACE déjà défini, doublon supprimé
      # AIRFLOW__OPENLINEAGE__DISABLED déjà défini, doublon supprimé
      AIRFLOW__CORE__ENABLE_OPENLINEAGE: 'True'
      # reste de tes variables Airflow existantes
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__METRICS__PROMETHEUS_USE_EXPORTER: 'True'
      AIRFLOW__METRICS__METRICS_BACKEND: prometheus
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
      # Add/Update these in Airflow services
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://openmetadata-server:8585/api/v1/lineage"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: 'itceq_airflow'
      # Ensure this is set to False (it is enabled by default in recent providers)
      AIRFLOW__OPENLINEAGE__DISABLED: 'False'
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs 
    command: airflow scheduler

    restart: always

  # ------------------------
  # Airflow Triggerer
  # ------------------------
  airflow-triggerer:
    build: ./airflow
    depends_on:
      - postgres-airflow
      - redis
    networks:
      - traefik-public
    environment:
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://openmetadata-server:8585/api/v1/lineage"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: 'itceq_airflow'
      AIRFLOW__OPENLINEAGE__DISABLED: 'False'
      AIRFLOW__CORE__ENABLE_OPENLINEAGE: 'True'
      # reste de tes variables Airflow existantes
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
    command: triggerer
    restart: always

  # ------------------------
  # Airflow Exporter
  # ------------------------
  airflow-exporter:
      build: ./airflow/airflow-exporter
      networks:
        - traefik-public
      environment:
        EXPORTER_PORT: 9112
        AIRFLOW_WEBSERVER: "http://airflow-webserver:8080/api/v1"
        AIRFLOW_USER: "${AIRFLOW_ADMIN_USER}"
        AIRFLOW_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
        AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
        LOKI_URL: "http://loki:3100"
        METRICS_TIME_WINDOW_DAYS: "30"  # Période de filtrage des métriques (peut être modifiée)
      ports:
        - "9112:9112"
      volumes:
        - ./airflow/logs:/opt/airflow/logs:ro
        - ./airflow/dags:/opt/airflow/dags:ro
      depends_on:
        - airflow-webserver
        - loki
      restart: always

  # ------------------------
  # Airflow Worker (Celery)
  # ------------------------
  airflow-worker:
    build: ./airflow
    networks:
      - traefik-public
    depends_on:
      - postgres-airflow
      - redis
    environment:
      # AIRFLOW__OPENLINEAGE__TRANSPORT déjà défini, doublon supprimé
      # AIRFLOW__OPENLINEAGE__NAMESPACE déjà défini, doublon supprimé
      # AIRFLOW__OPENLINEAGE__DISABLED déjà défini, doublon supprimé
      AIRFLOW__CORE__ENABLE_OPENLINEAGE: 'True'
      # reste de tes variables Airflow existantes
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-airflow:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'False'
      # Add/Update these in Airflow services
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://openmetadata-server:8585/api/v1/lineage"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: 'itceq_airflow'
    volumes:
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ./data:/opt/airflow/data
    command: celery worker
    restart: always

  # ------------------------
  # MinIO pour stockage
  # ------------------------
  minio:
    image: minio/minio:latest
    networks:
      - traefik-public
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - ./minio:/data   # raw + transformed
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.itceq.tn`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"


  minio-create-buckets:
    image: minio/mc:latest
    networks:
      - traefik-public
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb -p myminio/raw;
        mc mb -p myminio/transformed;
        mc mb -p myminio/refined;
        mc mb -p myminio/sandbox;
        mc mb -p myminio/spark-logs; 
        mc ls myminio;
      "
    restart: "no"  
                                                
  spark-master:
    build: ./spark
    container_name: spark-master
    networks:
      - traefik-public
    user: root
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_METRICS_CONF: "/opt/spark/conf/metrics.properties"
      # Configuration de l'agent
      SPARK_SUBMIT_OPTS: >-
        -Dspark.eventLog.enabled=true
        -Dspark.eventLog.dir=file:///opt/spark/events

    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
      - "8090:8090"  # JMX Prometheus Exporter
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
      - ./spark/events:/opt/spark/events
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spark.rule=Host(`spark.itceq.tn`)"
      - "traefik.http.routers.spark.entrypoints=web"
      - "traefik.http.services.spark.loadbalancer.server.port=8080"
    
  # ------------------------
  # Spark Workers
  # ------------------------
  spark-worker:
    build: ./spark
    container_name: spark-worker
    networks:
      - traefik-public
    depends_on:
      - spark-master
    environment:
      USER: root
      SPARK_USER: root
      HADOOP_USER_NAME: root
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_METRICS_CONF: "/opt/spark/conf/metrics.properties"
      SPARK_SUBMIT_OPTS: >-
        -Dspark.eventLog.enabled=true
        -Dspark.eventLog.dir=file:///opt/spark/events

    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
      - "8091:8091"  # JMX Prometheus Exporter
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ${MINIO_RAW_PATH}:/data/raw
      - ${MINIO_TRANSFORMED_PATH}:/data/transformed
      - ${MINIO_REFINED_PATH}:/data/refined
      - ${SPARK_JOBS_PATH}:/opt/spark/jobs
      - ./spark/events:/opt/spark/events
    restart: always

  spark-history-server:
    build: ./spark
    container_name: spark-history-server
    networks:
      - traefik-public
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:///opt/spark/events
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    volumes:
      - ./spark/events:/opt/spark/events
    ports:
      - "18080:18080"
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spark-history.rule=Host(`spark-history.itceq.tn`)"
      - "traefik.http.routers.spark-history.entrypoints=web"

  # ------------------------
  # Spark REST API Exporter
  # ------------------------
  spark-exporter:
    build: ./spark/spark-exporter
    container_name: spark-exporter
    networks:
      - traefik-public
    depends_on:
      - spark-master
    ports:
      - "9091:9091"
    restart: always
 

  # ------------------------
  # Prometheus
  # ------------------------
  prometheus:
    image: prom/prometheus:latest
    networks:
      - traefik-public
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=365d'  # 1 an de rétention (au lieu de 90j)
      - '--storage.tsdb.retention.size=100GB'  # 100GB max (au lieu de 50GB)
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.itceq.tn`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"


  # ------------------------
  # Grafana
  # ------------------------
  grafana:
    image: grafana/grafana:10.0.3
    networks:
      - traefik-public
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${GRAFANA_PROVISIONING_PATH}:/etc/grafana/provisioning
      - ${GRAFANA_DASHBOARDS_PATH}:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.itceq.tn`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ------------------------
  # Metabase
  # ------------------------
    # 1. METABASE APP (Port 3021)
  metabase:
    build:
      context: ./metabase/build
      dockerfile: Dockerfile
    container_name: metabase_app
    networks:
      - traefik-public
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "9191:9191"
    env_file:
      - ./metabase/env/metabase.env
    depends_on:
      metabase_db_internal:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.itceq.tn`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    environment:
      - MB_PROMETHEUS_SERVER_PORT=9191
 
  # 2. INTERNAL METADATA DB
  metabase_db_internal:
    image: postgres:15
    networks:
      - traefik-public
    container_name: metabase_db_internal
    environment:
      POSTGRES_DB: metabase_internal
      POSTGRES_USER: mb_internal_user
      POSTGRES_PASSWORD: mb_internal_pass
    volumes:
      - mb_internal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb_internal_user -d metabase_internal"]
      interval: 5s
      retries: 5
    
  # ------------------------
  # Metabase Exporter
  # ------------------------
  metabase-exporter:
    build: ./metabase/metabase-exporter
    container_name: metabase-exporter
    networks:
      - traefik-public
    environment:
      METABASE_URL: "http://metabase:3000"
      METABASE_USERNAME: "admin@example.com"
      METABASE_PASSWORD: "AdminPass123"
      EXPORTER_PORT: "9101"
      SCRAPE_INTERVAL: "30"
    ports:
      - "9101:9101"
    depends_on:
      - metabase
    restart: always
 
  # 3. ZERO-TOUCH DEPLOYER (The Magic)
  metabase_deployer:
    image: python:3.9-slim
    networks:
      - traefik-public
    container_name: metabase_deployer
    depends_on:
      - metabase
    volumes:
      - ./metabase/scripts:/scripts
      - ./metabase/saved_states:/saved_states # Mounts the JSONs
    working_dir: /scripts
    env_file:
      - ./metabase/env/metabase.env
    # Install libs -> Run Setup -> Run Import -> Exit
    command: >
      sh -c "pip install requests metabase-api && python deploy_solution.py"
 
 


  # ------------------------
  # pgAdmin
  # ------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    networks:
      - traefik-public
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${PGADMIN_SERVERS_PATH}:/pgadmin4/servers.json
    depends_on:
      - postgres-airflow
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.itceq.tn`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"


  # ------------------------
  # Loki (pour logs Airflow)
  # ------------------------
  loki:
    image: grafana/loki:2.8.2
    networks:
      - traefik-public
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-data/index:/loki/index
      - ./loki-data/chunks:/loki/chunks
      - ./loki-data/wal:/loki/wal
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      
    restart: always
 
  # ------------------------
  # Promtail (agent qui envoie les logs à Loki)
  # ------------------------
  promtail:
    image: grafana/promtail:2.9.0
    networks:
      - traefik-public
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./airflow/logs:/opt/airflow/logs:ro
      # Pas de volume persistant pour positions - force la relecture à chaque restart
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yaml
    restart: always


  # 1. Elasticsearch (Recherche)
  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: openmetadata-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # Augmenté à 1g pour éviter les plantages
    networks:
      - traefik-public
    ports:
      - "9200:9200"
    volumes:
      - openmetadata_es_data_clean:/usr/share/elasticsearch/data
    restart: always

  # 2. PostgreSQL (Base de données - Plus stable)
  openmetadata-postgres:
    image: postgres:13
    container_name: openmetadata-postgres
    networks:
      - traefik-public
    environment:
      POSTGRES_USER: openmetadata_user
      POSTGRES_PASSWORD: openmetadata_password
      POSTGRES_DB: openmetadata_db
    volumes:
      - openmetadata_pg_data:/var/lib/postgresql/data
    restart: always

  # 3. OpenMetadata Server
  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.3.1
    container_name: openmetadata-server
    networks:
      - traefik-public
    depends_on:
      - openmetadata-elasticsearch
      - openmetadata-postgres
    # Cette commande attend 10s, crée les tables, et lance le serveur
    entrypoint:
      - /bin/bash
      - -c
      - "echo 'Waiting for Postgres...' && sleep 10 && ./bootstrap/bootstrap_storage.sh migrate-all && ./bin/openmetadata-server-start.sh conf/openmetadata.yaml"
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_USER: openmetadata_user
      DB_PASSWORD: openmetadata_password
      DB_HOST: openmetadata-postgres
      DB_PORT: 5432
      DB_DBNAME: openmetadata_db
      
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8585"
      OPENMETADATA_PUBLIC_URL: "http://catalog.itceq.tn"
      PIPELINE_SERVICE_CLIENT_TYPE: openmetadata
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      PIPELINE_SERVICE_CLIENT_HOST_IP: openmetadata-server
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
    ports:
      - "8585:8585"
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=Host(`catalog.itceq.tn`)"
      - "traefik.http.routers.catalog.entrypoints=web"
      - "traefik.http.services.catalog.loadbalancer.server.port=8585"
  
  
  # 4. OpenMetadata Ingestion CLI 

  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.3.1
    container_name: openmetadata-ingestion
    networks:
      - traefik-public
    command: >
      bash -c "airflow db upgrade && 
      airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true && 
      (airflow scheduler &) && 
      exec airflow webserver"
    environment:
      # Connexion à OpenMetadata
      OPENMETADATA_SERVER_API_URL: http://openmetadata-server:8585/api
      # Connexion à la base de données SQL pour Airflow (Interne à OM)
      # On utilise les mêmes accès que le serveur OM
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://openmetadata_user:openmetadata_password@openmetadata-postgres:5432/openmetadata_db
      # Configuration de l'API Airflow
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
      # Indispensable pour que le serveur OM le reconnaisse
      AIRFLOW_HOST: openmetadata-ingestion
      AIRFLOW_PORT: 8080
    restart: always

volumes:
  mb_internal_data:
  pg_dwh_data:
  prometheus_data:
  openmetadata_es_data_clean:
  openmetadata_pg_data:

networks:
  traefik-public:
    external: true