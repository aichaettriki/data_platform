source:
  type: airflow
  serviceName: airflow_itceq
  serviceConnection:
    config:
      type: Airflow
      hostPort: http://airflow-webserver:8080
      numberOfStatus: 10
      connection:
        type: Postgres
        username: airflow
        authType:
          password: airflow
        database: airflow
        hostPort: postgres-airflow:5432
  sourceConfig:
    config:
      type: PipelineMetadata

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ""